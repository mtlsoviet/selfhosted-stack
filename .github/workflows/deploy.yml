name: Validate and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check apps compose.yaml
        run: docker compose --env-file .env.example config --quiet

      - name: Check apps Caddyfile
        run: |
          docker run --rm -e DOMAIN=example.com -e ACME_EMAIL=ci@example.com \
            -v "$PWD/caddy:/etc/caddy:ro" \
            caddy:2.11 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Check apps.json
        run: jq empty portal/apps.json

      - name: Check ops compose.yaml
        run: docker compose -f ops/compose.yaml --env-file ops/.env.example config --quiet

      - name: Check ops Caddyfile
        run: |
          docker run --rm -e DOMAIN=example.com -e ACME_EMAIL=ci@example.com -e APPS_IP=192.0.2.10 \
            -v "$PWD/ops/caddy:/etc/caddy:ro" \
            caddy:2.11 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
        # 192.0.2.10 = an address reserved for documentation, a safe stand-in

      - name: Check Prometheus config and rules
        run: |
          docker run --rm -v "$PWD/ops/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v3.13.1 check config /etc/prometheus/prometheus.yml

      - name: Check Alertmanager config
        run: |
          echo "https://example.invalid/webhook" > "$RUNNER_TEMP/discord_webhook"
          docker run --rm -v "$PWD/ops/alertmanager:/etc/alertmanager:ro" \
            -v "$RUNNER_TEMP/discord_webhook:/run/secrets/discord_webhook:ro" \
            --entrypoint amtool prom/alertmanager:v0.31.1 check-config /etc/alertmanager/alertmanager.yml
        # $RUNNER_TEMP = a scratch folder GitHub gives each job; the fake webhook file
        # stands in for the real one, which only exists on ops

  deploy-apps:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          APPS_KNOWN_HOSTS: ${{ secrets.APPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$APPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy to apps
        env:
          APPS_HOST: ${{ secrets.APPS_HOST }}
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "deploy@$APPS_HOST"

  deploy-ops:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare SSH
        env:
          OPS_DEPLOY_SSH_KEY: ${{ secrets.OPS_DEPLOY_SSH_KEY }}
          OPS_KNOWN_HOSTS: ${{ secrets.OPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OPS_DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$OPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy to ops
        env:
          OPS_HOST: ${{ secrets.OPS_HOST }}
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "deploy@$OPS_HOST"
