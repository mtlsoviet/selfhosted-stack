groups:
  - name: vm-health
    rules:
      - alert: TargetDown
        expr: up == 0              # "up" is 1 when a scrape works, 0 when it fails
        for: 1m                    # only fire if it stays down for a full minute
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.job }} on {{ $labels.vm }} is down"

      - alert: DiskAlmostFull
        expr: >
          (1 - node_filesystem_avail_bytes{mountpoint="/"}
             / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 85
        # free space divided by total size = the free fraction; 1 minus it, times 100 = % used
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Disk on {{ $labels.vm }} is {{ $value | humanize }}% full"
