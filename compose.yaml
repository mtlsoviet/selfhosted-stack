name: stack
services:
  caddy:
    image: caddy:2.11
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

  vaultwarden:
    image: vaultwarden/server:1.37.4
    restart: unless-stopped
    environment:
      DOMAIN: https://vault.${DOMAIN}
      SIGNUPS_ALLOWED: ${VW_SIGNUPS_ALLOWED}
      ADMIN_TOKEN: ${VW_ADMIN_TOKEN}
    volumes:
      - vaultwarden_data:/data
    networks: [web]

  bookstack:
    image: lscr.io/linuxserver/bookstack:version-v26.09   # LinuxServer.io's BookStack image
    restart: unless-stopped
    environment:
      PUID: "1000"                   # user ID the app runs as inside the container
      PGID: "1000"                   # group ID, same idea
      TZ: America/Toronto
      APP_URL: https://wiki.${DOMAIN}
      APP_KEY: ${BOOKSTACK_APP_KEY}  # encryption key for sessions; generated in Part B
      DB_HOST: bookstack-db          # the database service's name: Compose's DNS resolves it
      DB_PORT: "3306"
      DB_DATABASE: bookstack
      DB_USERNAME: bookstack
      DB_PASSWORD: ${BOOKSTACK_DB_PASSWORD}
    volumes:
      - bookstack_config:/config     # uploads, settings and logs
    depends_on:
      bookstack-db:
        condition: service_healthy   # wait until the database answers, not just until it starts
    networks: [web, bookstack-db]    # web: reachable by Caddy; bookstack-db: reaches its database

  bookstack-db:
    image: mariadb:11.4              # official MariaDB, 11.4 long-term-support series
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${BOOKSTACK_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: bookstack    # created automatically on first start
      MARIADB_USER: bookstack        # this user gets full rights on that database only
      MARIADB_PASSWORD: ${BOOKSTACK_DB_PASSWORD}   # must match DB_PASSWORD above
    volumes:
      - bookstack_db:/var/lib/mysql  # the database files
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]   # script shipped in the image
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [bookstack-db]         # only on the private network

  portal:
    image: alexvirtu/portal:1.0.0      # your image, the exact released version
    restart: unless-stopped
    volumes:
      - ./portal/apps.json:/usr/share/nginx/html/apps.json:ro   # the real list replaces the sample
    networks: [web]

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    network_mode: host        # use the VM's own network: no published port, so ufw applies to 9100
    pid: host                 # see the VM's processes, not only the container's
    command:
      - --path.rootfs=/host   # read disks and filesystems from the host root mounted below
    volumes:
      - /:/host:ro,rslave     # the VM's whole filesystem, read-only; rslave = also see mounts made later

  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    restart: unless-stopped
    network_mode: host        # listens on the VM's port 8080, protected by ufw
    privileged: true          # cAdvisor reads kernel and cgroup data that needs extra rights
    devices:
      - /dev/kmsg             # kernel messages (out-of-memory events)
    command:
      - --docker_only=true            # report containers, not every system process
      - --housekeeping_interval=30s   # collect every 30 s instead of 1 s: much less CPU
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro          # the Docker socket, to list containers
      - /sys:/sys:ro                  # cgroups: the per-container CPU and memory numbers
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  stack-backup:
    image: alexvirtu/stack-backup:1.0.0
    profiles: [backup]
    environment:
      RESTIC_REPOSITORY: s3:https://s3.${DOMAIN}/backups   # restic's address for the Garage bucket
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}                  # encrypts the backups: never lose it
      AWS_ACCESS_KEY_ID: ${GARAGE_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${GARAGE_SECRET_KEY}
      AWS_DEFAULT_REGION: garage                           # must match s3_region in garage.toml
      BOOKSTACK_DB_ROOT_PASSWORD: ${BOOKSTACK_DB_ROOT_PASSWORD}
      TZ: America/Toronto
    volumes:
      - vaultwarden_data:/data/vaultwarden    # read-write: sqlite3 needs it to make a safe copy
      - bookstack_config:/data/bookstack:ro   # BookStack's uploads and settings, read-only
    networks: [web, bookstack-db]

  authentik-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASSWORD}
    volumes:
      - authentik_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d authentik -U authentik"]   # answers once Postgres accepts connections
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [authentik-db]

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.3
    restart: unless-stopped
    command: server                     # the same image runs as "server" (web + API) or "worker"
    environment: &authentik-env         # &name = a YAML anchor: this block can be reused below
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${ACME_EMAIL}     # the first admin (akadmin), set without the web wizard
      AUTHENTIK_BOOTSTRAP_PASSWORD_HASH: ${AUTHENTIK_BOOTSTRAP_PASSWORD_HASH}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - authentik_data:/data
    depends_on:
      authentik-db:
        condition: service_healthy
    networks: [web, authentik-db]

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.3
    restart: unless-stopped
    command: worker                     # background tasks: emails, cleanups, certificate checks
    environment: *authentik-env         # *name = reuse the anchored block: one place to edit
    volumes:
      - authentik_data:/data
    depends_on:
      authentik-db:
        condition: service_healthy
    networks: [web, authentik-db]

networks:
  web: {}                            # shared by Caddy and the apps it serves
  bookstack-db:
    internal: true                   # no route in or out: only BookStack can reach its database
  authentik-db:
    internal: true


volumes:                             # named volumes: data that survives "docker compose down"
  caddy_data: {}
  caddy_config: {}
  vaultwarden_data: {}
  bookstack_config: {}
  bookstack_db: {}
  authentik_data: {}
  authentik_db: {}
